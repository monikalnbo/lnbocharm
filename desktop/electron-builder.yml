# CodeForge 桌面端打包：绿色便携 zip，解压即用（任务 #38）
appId: com.lnbo.codeforge
productName: CodeForge
directories:
  output: release
files:
  - src/**/*
  - preload.js
extraResources:
  # 前端产物与 pylib 引擎随包分发
  - from: ../frontend/dist
    to: frontend/dist          # 与 backend/src/index.js 的 ../../frontend/dist 解析对齐
  - from: ../pylib
    to: pylib
  - from: ../shared
    to: shared
  - from: ../toolchains
    to: toolchains
  - from: ../backend
    to: backend
    filter:
      - "**/*"
      - "!tests/**"
      - "!**/*.test.js"
      - "!**/__pycache__/**"

win:
  target: [{ target: zip, arch: [x64] }]
linux:
  target: [{ target: zip, arch: [x64] }]
  category: Development
mac:
  target: [{ target: zip, arch: [x64, arm64] }]
